<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeConnect Checkout</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .checkout-shell {
        max-width: 900px;
        margin: 40px auto 80px;
      }

      .checkout-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
      }

      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 24px;
      }

      .checkout-form {
        display: grid;
        gap: 16px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .checkout-input,
      .checkout-select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font: inherit;
      }

      .radio-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
      }

      .summary-list {
        list-style: none;
        padding: 0;
        margin: 18px 0 0;
        display: grid;
        gap: 12px;
      }

      .summary-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .totals {
        margin-top: 20px;
        font-size: 1.2rem;
        font-weight: 800;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <div class="brand-mark">H</div>
          <span>HomeConnect</span>
        </div>
        <nav class="menu">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="wallet.html">Wallet</a>
          <a href="invoices.html">Invoices</a>
        </nav>
        <a class="button button-primary" href="wallet.html">Wallet</a>
      </div>
    </header>

    <main>
      <div class="container checkout-shell">
        <div class="section-heading">
          <p class="eyebrow">Checkout</p>
          <h2>Complete your payment</h2>
        </div>

        <div class="checkout-grid">
          <div class="panel">
            <form id="checkoutForm" class="checkout-form">
              <div class="field-row">
                <label>
                  <span>Customer name</span>
                  <input class="checkout-input" type="text" name="customerName" placeholder="Full name" required />
                </label>
                <label>
                  <span>Email</span>
                  <input class="checkout-input" type="email" name="email" placeholder="you@example.com" required />
                </label>
              </div>

              <label>
                <span>Service</span>
                <input class="checkout-input" type="text" name="service" placeholder="Plumbing repair" required />
              </label>

              <div class="field-row">
                <label>
                  <span>Amount</span>
                  <input class="checkout-input" type="number" name="amount" min="1" step="0.01" placeholder="980" required />
                </label>
                <label>
                  <span>Payment method</span>
                  <select class="checkout-select" name="paymentMethod">
                    <option value="wallet">App wallet</option>
                    <option value="card">Card</option>
                  </select>
                </label>
              </div>

              <div class="radio-row">
                <label><input type="checkbox" name="useWallet" value="true" checked /> Use wallet</label>
              </div>

              <div class="field-row">
                <label>
                  <span>Card number</span>
                  <input class="checkout-input" type="text" name="cardNumber" placeholder="4242 4242 4242 4242" />
                </label>
                <label>
                  <span>Expiry</span>
                  <input class="checkout-input" type="text" name="expiry" placeholder="MM/YY" />
                </label>
              </div>

              <label>
                <span>CVV</span>
                <input class="checkout-input" type="text" name="cvc" placeholder="123" />
              </label>

              <button type="submit" class="button button-primary full-width">Pay now</button>
              <p id="checkoutMessage" class="form-message" aria-live="polite"></p>
            </form>
          </div>

          <aside class="panel">
            <h3>Order summary</h3>
            <ul class="summary-list">
              <li><span>Service</span><strong>Quote-approved job</strong></li>
              <li><span>Processing</span><strong>Instant</strong></li>
              <li><span>Protection</span><strong>Secure</strong></li>
            </ul>
            <div class="totals">
              <span>Total</span>
              <span id="checkoutTotal">$0.00</span>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="checkout.js"></script>
  </body>
</html>
