<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeConnect Admin Login</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .auth-card {
        width: min(100%, 440px);
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px 24px;
        box-shadow: var(--shadow);
      }

      .auth-card h2 {
        margin: 0 0 12px;
      }

      .auth-card p {
        margin: 0 0 22px;
        color: var(--muted);
      }

      .auth-result {
        min-height: 24px;
        margin-top: 12px;
        color: var(--primary-dark);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Admin access</p>
        <h2>Login to HomeConnect</h2>
        <p>Manage bookings, providers, and daily home operations.</p>

        <form id="loginForm">
          <label>
            Username
            <input type="text" name="username" placeholder="admin" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="Enter password" required />
          </label>
          <button type="submit" class="button button-primary full-width">Sign in</button>
          <p id="loginMessage" class="auth-result" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
